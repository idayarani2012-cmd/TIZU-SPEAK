<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1b1c1f;--muted:#5c6068;--line:#d9d4c8;
  --brand:#1d4f9f;--onbrand:#ffffff;--bot:#e4ecfb;--me:#d9f1e0;--warn:#fff1c9;--ok:#dcf3e2;--bad:#fde4e0;
  --red:#d92d20;--redd:#b42318;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121316;--card:#1c1e23;--ink:#f0f1f3;--muted:#a6aab3;--line:#363941;
    --brand:#8fb4ff;--onbrand:#0b1220;--bot:#25324d;--me:#1d3a2a;--warn:#3a3217;--ok:#173322;--bad:#40201c}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.screen[hidden]{display:none!important}
.pad{padding:16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:1.2em 0 .4em}
.hero{text-align:center;margin:6px 0 14px}
.flag{font-size:2.4rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--brand);color:var(--onbrand);font-size:.85rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.lbl{font-weight:700;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:block}
select,input[type=text]{width:100%;min-height:52px;font-size:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.btn{min-height:52px;padding:0 18px;font-size:1.02rem;font-weight:650;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--brand);color:var(--onbrand);border-color:transparent}
.btn.big{min-height:60px;font-size:1.15rem}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn.danger{color:var(--redd);border-color:var(--redd)}
.btn:active{transform:scale(.98)}
.banner{margin:8px 12px 0;padding:10px 12px;border-radius:12px;font-size:.92rem;border:1px solid var(--line);background:var(--card)}
.banner.warn{background:var(--warn)}
.banner[hidden]{display:none}
.testout{min-height:1.4em;font-size:.95rem}
/* chat */
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .grow{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:4px;background:var(--line)}
.progress div{height:100%;width:0;background:var(--brand);transition:width .3s}
#log{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin:8px 0}
.msg.me{justify-content:flex-end}
.msg.hint{justify-content:center}
.bubble{max-width:88%;padding:10px 13px;border-radius:18px;background:var(--bot);word-wrap:break-word}
.msg.me .bubble{background:var(--me)}
.msg.hint .bubble{background:var(--warn);font-size:.95rem}
.tools{display:flex;gap:6px;margin-top:6px}
.mini{min-width:44px;min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
.enline{margin-top:6px;color:var(--muted);font-style:italic}
.fb{margin:4px 0 8px 6px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:.95rem;max-width:94%}
.fb.s3{background:var(--ok)}.fb.s2{background:var(--warn)}.fb.s1,.fb.s0{background:var(--bad)}
.fb .score{font-weight:800}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.fb .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.divider{text-align:center;color:var(--muted);font-size:.88rem;margin:12px 0}
.finishbar{text-align:center;margin:14px 0}
#dock{border-top:1px solid var(--line);background:var(--card);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
#live{min-height:1.5em;text-align:center;font-size:.95rem;color:var(--muted);margin-bottom:4px}
.dockrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dockrow .btn{flex:1;min-height:56px}
.micwrap{display:flex;flex-direction:column;align-items:center;flex:0 0 110px}
#mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 4px 14px rgba(217,45,32,.45)}
#mic.busy{opacity:.7}
#mic.rec{animation:pulse 1.1s infinite;background:var(--redd)}
#btn-test.rec{background:var(--red);color:#fff}
#btn-test.busy{opacity:.7}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.6)}70%{box-shadow:0 0 0 22px rgba(217,45,32,0)}100%{box-shadow:0 0 0 0 rgba(217,45,32,0)}}
#miclabel{font-size:.78rem;color:var(--muted);margin-top:4px;text-align:center;min-height:2.2em}
#typeform{display:flex;gap:8px;margin-top:8px}
#typeform input{flex:1}
#typeform .btn{min-height:52px}
/* end + prof */
.pct{font-size:3.4rem;font-weight:800;line-height:1.1}
.turn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.turn .s{display:inline-block;min-width:44px;text-align:center;border-radius:99px;padding:1px 8px;font-weight:800;font-size:.85rem;margin-right:6px}
.s3{background:var(--ok)}.s2{background:var(--warn)}.s1,.s0{background:var(--bad)}
.corr li{margin:3px 0}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
td input{min-height:40px;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <section id="screen-start" class="screen">
    <div class="pad">
      <div class="hero"><div class="flag">🇫🇷</div><h1 id="title"></h1><span id="levelbadge" class="badge"></span></div>
      <div class="card"><span class="lbl">Scène</span><div id="scene"></div></div>
      <label class="lbl" for="student">Élève</label>
      <select id="student"></select>
      <div class="stack">
        <button id="btn-start" class="btn primary big" type="button">Commencer</button>
        <button id="btn-test" class="btn" type="button">Tester le micro</button>
        <div id="testout" class="testout" aria-live="polite"></div>
        <button id="btn-prof" class="btn" type="button">Espace prof</button>
      </div>
    </div>
  </section>

  <section id="screen-chat" class="screen" hidden>
    <div class="bar"><button id="btn-quit" class="btn small" type="button" aria-label="Retour">←</button><div id="who" class="grow"></div><div id="prog" class="small muted"></div></div>
    <div class="progress"><div id="progbar"></div></div>
    <div id="log" aria-live="polite"></div>
    <div id="dock">
      <div id="live"></div>
      <div class="dockrow">
        <button id="btn-hint" class="btn" type="button">💡 Indice</button>
        <div class="micwrap"><button id="mic" type="button" aria-label="Microphone">🎤</button><div id="miclabel">Touchez pour parler</div></div>
        <button id="btn-repeat" class="btn" type="button">🔁 Répéter</button>
      </div>
      <form id="typeform" autocomplete="off">
        <input id="typed" type="text" lang="fr" placeholder="Ou écrivez votre réponse…" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button class="btn primary" type="submit">Envoyer</button>
      </form>
    </div>
  </section>

  <section id="screen-end" class="screen" hidden>
    <div class="pad">
      <div class="center"><div id="end-who" class="muted"></div><div id="end-pct" class="pct"></div><div id="end-pts" class="muted"></div><div id="end-msg"></div></div>
      <h2>Corrections</h2><div id="end-corr"></div>
      <h2>Mon dialogue</h2><div id="end-turns"></div>
      <div class="stack">
        <button id="btn-again" class="btn primary" type="button">Recommencer</button>
        <button id="btn-copy" class="btn" type="button">Copier le bilan</button>
        <button id="btn-other" class="btn" type="button">Autre élève</button>
      </div>
    </div>
  </section>

  <section id="screen-prof" class="screen" hidden>
    <div class="bar"><button id="prof-back" class="btn small" type="button">← Retour</button><div class="grow">Espace prof</div></div>
    <div class="pad">
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Nom</th><th>Essais</th><th>Dernier</th><th>Meilleur</th></tr></thead><tbody id="prof-body"></tbody></table></div>
      <div class="row wrap" style="margin-top:14px"><button id="prof-copy" class="btn" type="button">Copy all results</button><button id="prof-reset" class="btn danger" type="button">Reset</button></div>
      <p class="muted small">Les noms sont modifiables. Les résultats sont enregistrés sur cet appareil (localStorage).</p>
    </div>
  </section>
</div>

<script>
const LESSON = {{LESSON_JSON}};

/* CHECKER-START */
const ENGLISH_WORDS = new Set(("the and you your yours are is was were with what how please thanks thank hello hi hey bye goodbye yes want wants would like have has my mine name am be been at not no ok okay sorry good morning evening night very much can could it this that these for of to in from here there bill check coffee tea water milk juice bread sugar cheese cake rice nice day welcome sir madam do does did will shall may he she we they his her our their them but if when where who why which just yeah love eat drink order price cost money pay one").split(" "));

function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ").trim();
}
function expandList(list, L, depth){
  depth = depth || 0;
  if (list == null) return [];
  if (typeof list === "string") list = [list];
  const lists = (L && L.lists) || {};
  const out = [];
  list.forEach(function(w){
    if (typeof w === "string" && w.charAt(0) === "@") {
      if (depth < 5) expandList(lists[w.slice(1)] || [], L, depth + 1).forEach(function(x){ out.push(x); });
    } else out.push(w);
  });
  return out;
}
function hasAny(padded, list, L){
  return expandList(list, L).some(function(w){
    const n = norm(w);
    return n !== "" && padded.indexOf(" " + n + " ") >= 0;
  });
}
function testRe(padded, re){
  try { return new RegExp(re, "i").test(padded); } catch (e) { return false; }
}
function condTrue(cond, answers, L){
  if (Array.isArray(cond)) return cond.every(function(c){ return condTrue(c, answers, L); });
  if (!cond || answers[cond.turn] === undefined) return false;
  const padded = " " + norm(answers[cond.turn]) + " ";
  if (cond.any && !hasAny(padded, cond.any, L)) return false;
  if (cond.none && hasAny(padded, cond.none, L)) return false;
  if (cond.re && !testRe(padded, cond.re)) return false;
  return true;
}
function resolveTurn(turn, answers, L){
  answers = answers || {};
  if (turn.skipIf && condTrue(turn.skipIf, answers, L)) return null;
  const r = {};
  Object.keys(turn).forEach(function(k){ if (k !== "variants" && k !== "skipIf") r[k] = turn[k]; });
  r.variant = null;
  (turn.variants || []).some(function(v, vi){
    if (condTrue(v.when, answers, L)) {
      Object.keys(v).forEach(function(k){ if (k !== "when" && k !== "name") r[k] = v[k]; });
      r.variant = v.name || ("variante " + (vi + 1));
      return true;
    }
    return false;
  });
  r.mistakes = (r.mistakes || []).concat((L && L.commonMistakes) || []);
  return r;
}
function evaluate(text, r, L){
  const raw = String(text == null ? "" : text).trim();
  const t = norm(raw), padded = " " + t + " ";
  const tokens = t ? t.split(" ") : [];
  const found = [], missing = [];
  (r.required || []).forEach(function(q){ (hasAny(padded, q.any, L) ? found : missing).push(q); });
  const mistakes = [];
  (r.mistakes || []).forEach(function(m){
    let hit = (m.any && hasAny(padded, m.any, L)) || (m.re && testRe(padded, m.re));
    if (hit && m.unless && hasAny(padded, m.unless, L)) hit = false;
    if (hit) mistakes.push({ id: m.id, tip: m.tip });
  });
  const eng = tokens.filter(function(w){ return ENGLISH_WORDS.has(w); });
  const ratio = tokens.length ? eng.length / tokens.length : 0;
  const isEnglish = tokens.length > 0 && (ratio >= 0.5 || (eng.length >= 2 && ratio >= 0.3));
  if (eng.length) {
    const uniq = eng.filter(function(w, i){ return eng.indexOf(w) === i; });
    mistakes.push({ id: "english", tip: isEnglish
      ? "Please answer in French. English words found: " + uniq.join(", ") + "."
      : "English word" + (uniq.length > 1 ? "s" : "") + " found: " + uniq.join(", ") + ". Use French (or ask « Comment dit-on … ? »)." });
  }
  const total = (r.required || []).length;
  const f = total ? found.length / total : 1;
  let base = f === 1 ? 3 : f >= 0.5 ? 2 : f > 0 ? 1 : 0;
  if (!t) base = 0;
  let score = Math.max(0, base - Math.min(2, mistakes.length));
  if (isEnglish) score = Math.min(score, 1);
  return { text: raw, norm: t, score: score, found: found, missing: missing, mistakes: mistakes, isEnglish: isEnglish };
}
function evaluateBest(cands, r, L){
  let best = null;
  (cands || []).forEach(function(c){
    if (!String(c || "").trim()) return;
    const e = evaluate(c, r, L);
    if (!best || e.score > best.score ||
        (e.score === best.score && (e.found.length > best.found.length ||
          (e.found.length === best.found.length && e.mistakes.length < best.mistakes.length)))) best = e;
  });
  return best || evaluate("", r, L);
}
/* CHECKER-END */

(function(){
"use strict";
const L = LESSON;
const TURNS = L.turns || [];
const N = Math.max(1, parseInt(L.students, 10) || 1);
const LV = String(L.level || "");
const RATE = L.rate || (/^A1/i.test(LV) ? 0.75 : /^A2/i.test(LV) ? 0.9 : 1);
const KEY = "fsp:" + (L.id || L.title);
const $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

const MSG = {
  https: "🔒 The microphone only works from an https:// link, and this page was opened as a file (or from an insecure address). Upload the page to Netlify Drop (app.netlify.com/drop), open the https link it gives you, then try again. You can type your answers meanwhile.",
  denied: "🎤 Microphone permission was refused. Tap the lock / settings icon next to the web address, allow the microphone for this page, then reload. You can type your answers meanwhile.",
  nomic: "🎤 No microphone was found. Plug in or enable a microphone, or type your answers.",
  busy: "🎤 The microphone is being used by another app. Close it and try again.",
  network: "📶 No internet connection. Speech recognition needs the internet. Check your connection or type your answers.",
  unsupported: "This browser cannot recognise speech. Please use Google Chrome (Android or computer), or Safari on iPhone with Siri turned on (Settings › Siri). You can still type your answers.",
  lang: "This browser does not support French speech recognition. Try Google Chrome, or type your answers.",
  empty: "I did not hear anything. Tap the red microphone, speak a little louder, or type your answer.",
  generic: "The microphone could not start. Tap it again, reload the page, or type your answer.",
  novoice: "No French voice was found on this device, so the bot may speak with the wrong accent. Add French in your phone's text-to-speech / language settings. You can still read the text."
};
function banner(msg, kind){
  const b = $("banner");
  if (!msg) { b.hidden = true; b.textContent = ""; return; }
  b.textContent = msg; b.className = "banner " + (kind || "warn"); b.hidden = false;
}

/* ---------- storage (localStorage can fail: always try/catch) ---------- */
let store = { names: [], stats: [] };
function loadStore(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!s || typeof s !== "object") s = {};
  store = { names: Array.isArray(s.names) ? s.names : [], stats: Array.isArray(s.stats) ? s.stats : [] };
  for (let i = 0; i < N; i++) {
    if (!store.names[i] || typeof store.names[i] !== "string") store.names[i] = "Élève " + (i + 1);
    if (!store.stats[i] || typeof store.stats[i] !== "object") store.stats[i] = { attempts: 0, last: null, best: null };
  }
}
function saveStore(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- speech synthesis ---------- */
let voices = [];
function loadVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
function pickVoice(){
  loadVoices();
  return voices.find(function(v){ return /^fr[-_]FR$/i.test(v.lang); }) ||
         voices.find(function(v){ return /^fr/i.test(v.lang); }) || null;
}
let speakToken = 0;
function stopBot(){
  speakToken++;
  try { window.speechSynthesis.cancel(); } catch (e) {}
}
function speak(text){
  if (!("speechSynthesis" in window)) return;
  stopBot();
  const my = speakToken;
  setTimeout(function(){
    if (my !== speakToken) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      const v = pickVoice(); if (v) u.voice = v;
      u.rate = RATE; u.pitch = 1;
      window._u = u; /* keep a reference: some browsers drop it */
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }, 60);
}
try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
loadVoices();

/* ---------- microphone engine ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Mic = (function(){
  let state = "idle", rec = null, session = 0, permOK = false, ctx = null;
  let finished = true, lastInterim = "", finalAlts = [], retried = false, userStopped = false, startedAt = 0;
  const T = { max: null, fin: null, force: null };
  const api = { onState: function(){} };

  function clearTimers(){ for (const k in T) { if (T[k]) { clearTimeout(T[k]); T[k] = null; } } }
  function detach(){
    if (rec) {
      const r = rec; rec = null;
      r.onstart = r.onresult = r.onerror = r.onend = null;
      try { r.abort(); } catch (e) {}
    }
  }
  function setState(s){ state = s; try { api.onState(s, ctx && ctx.mode); } catch (e) {} }
  function precheck(){
    if (!SR) return "unsupported";
    const h = location.hostname;
    const secure = location.protocol === "https:" || h === "localhost" || h === "127.0.0.1";
    if (!secure) return "https";
    return null;
  }
  function errKind(err){
    const n = err && err.name;
    if (n === "InsecureError") return "https";
    if (n === "NotAllowedError" || n === "SecurityError" || n === "PermissionDeniedError") return "denied";
    if (n === "NotFoundError" || n === "DevicesNotFoundError" || n === "OverconstrainedError") return "nomic";
    if (n === "NotReadableError" || n === "TrackStartError") return "busy";
    return "generic";
  }
  async function ensurePermission(){
    if (permOK) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (!window.isSecureContext) throw { name: "InsecureError" };
      return;
    }
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    try { s.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
    permOK = true;
  }
  function fail(kind){
    const c = ctx;
    clearTimers(); detach(); finished = true; setState("idle");
    if (c && c.onError) c.onError(kind);
  }
  function finish(why){
    if (finished) return;
    finished = true; clearTimers();
    const alts = finalAlts.length ? finalAlts : (lastInterim ? [lastInterim] : []);
    const elapsed = Date.now() - startedAt;
    const c = ctx;
    detach(); setState("idle");
    if (!alts.length) {
      /* ended with nothing within 1.5 s: retry once, automatically */
      if (!retried && !userStopped && elapsed < 1500) { retried = true; begin(c, true); return; }
      if (c && c.onEmpty) c.onEmpty();
      return;
    }
    if (c && c.onResult) c.onResult(alts);
  }
  function stopTap(){
    if (state !== "recording") return;
    userStopped = true; setState("stopping");
    const my = session;
    try { if (rec) rec.stop(); } catch (e) {}
    if (T.force) clearTimeout(T.force);
    T.force = setTimeout(function(){ if (my === session) finish("force"); }, 1200); /* some phones never send 'end' */
  }
  async function begin(c, isRetry){
    ctx = c;
    clearTimers(); detach(); stopBot();               /* abort previous, cancel bot speech */
    const my = ++session;
    finished = false; lastInterim = ""; finalAlts = []; userStopped = false;
    if (!isRetry) retried = false;
    const pre = precheck();
    if (pre) { fail(pre); return; }
    setState("starting");
    try { await ensurePermission(); }
    catch (err) { if (my !== session) return; permOK = false; fail(errKind(err)); return; }
    if (my !== session) return;
    await sleep(350);                                  /* let the audio device settle */
    if (my !== session) return;
    stopBot();
    let r;
    try { r = new SR(); } catch (e) { fail("unsupported"); return; }   /* a NEW object for every answer */
    rec = r;
    r.lang = "fr-FR"; r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
    r.onresult = function(e){
      if (my !== session || finished) return;
      let top = "", finals = 0;
      const res = e.results;
      for (let i = 0; i < res.length; i++) {
        const a = res[i][0];
        if (a && a.transcript) top += (top ? " " : "") + a.transcript.trim();
        if (res[i].isFinal) finals++;
      }
      if (top) { lastInterim = top; if (ctx && ctx.onInterim) ctx.onInterim(top); }
      if (res.length && finals === res.length) {
        if (res.length === 1) {
          const alts = [];
          for (let j = 0; j < res[0].length; j++) {
            const t = (res[0][j].transcript || "").trim();
            if (t && alts.indexOf(t) < 0) alts.push(t);
          }
          finalAlts = alts;
        } else finalAlts = top ? [top] : [];
        if (T.fin) clearTimeout(T.fin);
        T.fin = setTimeout(function(){ if (my === session) finish("final"); }, 700);  /* 'end' may never come */
      }
    };
    r.onerror = function(e){
      if (my !== session || finished) return;
      const k = e && e.error;
      if (k === "aborted") return;
      if (k === "not-allowed" || k === "service-not-allowed") { permOK = false; fail("denied"); return; }
      if (k === "audio-capture") { fail("nomic"); return; }
      if (k === "network") { fail("network"); return; }
      if (k === "language-not-supported") { fail("lang"); return; }
      if (T.fin) clearTimeout(T.fin);                  /* no-speech etc.: 'end' should follow, but do not wait forever */
      T.fin = setTimeout(function(){ if (my === session) finish("error"); }, 700);
    };
    r.onend = function(){ if (my !== session || finished) return; finish("end"); };
    startedAt = Date.now();
    try { r.start(); } catch (e) { fail("generic"); return; }
    setState("recording");
    T.max = setTimeout(function(){ if (my === session && state === "recording") stopTap(); }, 15000);  /* stop after 15 s */
  }
  api.tap = function(c){
    if (state === "starting" || state === "stopping") return;   /* ignore taps while starting: no double recordings */
    if (state === "recording") { stopTap(); return; }
    begin(c, false);
  };
  api.cancel = function(){
    session++; clearTimers(); detach(); finished = true;
    if (state !== "idle") setState("idle");
    ctx = null;
  };
  api.state = function(){ return state; };
  return api;
})();

Mic.onState = function(state, mode){
  const m = $("mic"), t = $("btn-test");
  m.classList.remove("rec", "busy"); t.classList.remove("rec", "busy");
  t.textContent = "Tester le micro";
  $("miclabel").textContent = "Touchez pour parler";
  if (state === "idle") { if (mode !== "test") $("live").textContent = ""; return; }
  const test = mode === "test";
  if (state === "starting") {
    if (test) { t.classList.add("busy"); t.textContent = "…"; $("testout").textContent = "Préparation du micro…"; }
    else { m.classList.add("busy"); $("miclabel").textContent = "Préparation…"; $("live").textContent = "Préparation du micro…"; }
  } else if (state === "recording") {
    if (test) { t.classList.add("rec"); t.textContent = "⏹ Arrêter"; $("testout").textContent = "🎤 Dites : « Bonjour ! »"; }
    else { m.classList.add("rec"); $("miclabel").textContent = "Je vous écoute… touchez pour arrêter"; $("live").textContent = "🎤 Parlez maintenant…"; }
  } else if (state === "stopping") {
    if (test) { t.classList.add("busy"); t.textContent = "…"; }
    else { m.classList.add("busy"); $("miclabel").textContent = "Un instant…"; }
  }
};

/* ---------- state ---------- */
let student = 0, run = null, cur = null;

function show(name){
  ["start", "chat", "end", "prof"].forEach(function(n){ $("screen-" + n).hidden = n !== name; });
  try { window.scrollTo(0, 0); } catch (e) {}
}
function scrollLog(){ const l = $("log"); setTimeout(function(){ l.scrollTop = l.scrollHeight; }, 20); }
function fillSelect(){
  const s = $("student"), keep = student;
  s.textContent = "";
  for (let i = 0; i < N; i++) { const o = document.createElement("option"); o.value = i; o.textContent = store.names[i]; s.appendChild(o); }
  s.selectedIndex = Math.min(keep, N - 1);
}
function copyText(txt){
  return new Promise(function(resolve){
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){ resolve(true); }, function(){ resolve(fallbackCopy(txt)); });
        return;
      }
    } catch (e) {}
    resolve(fallbackCopy(txt));
  });
}
function fallbackCopy(txt){
  try {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function flash(btn, ok){
  const old = btn.dataset.label || btn.textContent; btn.dataset.label = old;
  btn.textContent = ok ? "Copié ✔" : "Copie impossible";
  setTimeout(function(){ btn.textContent = old; }, 1600);
}

/* ---------- dialogue ---------- */
function progress(){
  const total = TURNS.length;
  const n = run ? Math.min(run.i + (cur ? 1 : 0), total) : 0;
  $("prog").textContent = n + " / " + total;
  $("progbar").style.width = (total ? Math.round((run ? run.i : 0) / total * 100) : 0) + "%";
}
function addBot(r){
  const row = el("div", "msg bot"), b = el("div", "bubble");
  b.appendChild(el("span", "txt", r.bot));
  const tools = el("div", "tools");
  const rp = el("button", "mini", "🔊"); rp.type = "button"; rp.setAttribute("aria-label", "Écouter à nouveau");
  rp.onclick = function(){ Mic.cancel(); speak(r.bot); };
  tools.appendChild(rp);
  const enl = el("div", "enline", r.en || ""); enl.hidden = true;
  if (r.en) {
    const en = el("button", "mini", "EN"); en.type = "button"; en.setAttribute("aria-label", "Show English");
    en.onclick = function(){ enl.hidden = !enl.hidden; };
    tools.appendChild(en);
  }
  b.appendChild(tools); b.appendChild(enl); row.appendChild(b);
  $("log").appendChild(row); scrollLog();
  return row;
}
function presentTurn(opts){
  opts = opts || {};
  if (!run) return;
  run.nextTimer = null;
  while (run.i < TURNS.length) {
    const r = resolveTurn(TURNS[run.i], run.answers, L);
    if (r) {
      cur = { idx: run.i, r: r, mode: "normal" };
      run.pendingEl = addBot(r);
      if (opts.speak !== false) speak(r.bot);
      progress();
      return;
    }
    run.i++;
  }
  cur = null; progress();
  const bar = el("div", "finishbar");
  const b = el("button", "btn primary big", "Voir mon bilan ➜"); b.type = "button"; b.onclick = showEnd;
  bar.appendChild(b); $("log").appendChild(bar); run.pendingEl = bar; scrollLog();
}
const LABELS = ["Essayez encore", "À améliorer", "Presque !", "Très bien !"];
function feedbackCard(res, r, rec){
  const card = el("div", "fb s" + res.score);
  card.appendChild(el("div", "score", "★".repeat(res.score) + "☆".repeat(3 - res.score) + "  " + res.score + "/3 · " + LABELS[res.score]));
  const items = [];
  res.missing.forEach(function(q){ items.push("Missing: " + q.label + (q.eg ? " — e.g. « " + q.eg + " »" : "")); });
  res.mistakes.forEach(function(m){ items.push(m.tip); });
  if (items.length) {
    const ul = el("ul");
    items.forEach(function(t){ ul.appendChild(el("li", null, t)); });
    card.appendChild(ul);
  }
  if (rec.best !== res) card.appendChild(el("div", "small muted", "Meilleure tentative gardée : " + rec.best.score + "/3"));
  if (res.score < 3) {
    const act = el("div", "actions");
    const fix = el("button", "btn small fixbtn", "Corriger ma réponse"); fix.type = "button";
    fix.onclick = function(){ startCorrection(r.id); };
    act.appendChild(fix); card.appendChild(act);
  }
  return card;
}
function submitAnswer(alts){
  if (!run || !cur) return;
  const c = cur;
  const res = evaluateBest(alts, c.r, L);
  if (!res.text) { banner(MSG.empty, "info"); return; }
  cur = null; banner("");
  const me = el("div", "msg me"); me.appendChild(el("div", "bubble", res.text)); $("log").appendChild(me);
  const rec = run.rec[c.r.id] || (run.rec[c.r.id] = { idx: c.idx, r: c.r, attempts: 0, best: null });
  rec.attempts++;
  if (!rec.best || res.score > rec.best.score) rec.best = res;      /* keep the best attempt */
  run.answers[c.r.id] = rec.best.text;
  document.querySelectorAll(".fixbtn").forEach(function(b){ b.remove(); });
  $("log").appendChild(feedbackCard(res, c.r, rec));
  if (c.mode === "normal") run.i = c.idx + 1;
  progress(); scrollLog();
  run.nextTimer = setTimeout(function(){ presentTurn(); }, (res.missing.length || res.mistakes.length) ? 1500 : 900);
}
function startCorrection(id){
  if (!run) return;
  const rec = run.rec[id]; if (!rec) return;
  clearTimeout(run.nextTimer); run.nextTimer = null;
  Mic.cancel(); stopBot();
  if (run.pendingEl) { run.pendingEl.remove(); run.pendingEl = null; }
  document.querySelectorAll(".fixbtn").forEach(function(b){ b.remove(); });
  $("log").appendChild(el("div", "divider", "↩ Corrigeons : même question"));
  cur = { idx: rec.idx, r: rec.r, mode: "correct" };
  addBot(rec.r); speak(rec.r.bot);
}
function startRun(){
  banner(""); stopBot(); Mic.cancel();
  run = { i: 0, answers: {}, rec: {}, nextTimer: null, pendingEl: null, saved: false };
  cur = null;
  $("log").textContent = ""; $("typed").value = "";
  $("who").textContent = store.names[student];
  show("chat");
  presentTurn();
}
function micTap(){
  if (!run) return;
  if (Mic.state() === "idle" && !cur) {
    if (run.nextTimer) { clearTimeout(run.nextTimer); run.nextTimer = null; presentTurn({ speak: false }); }
    if (!cur) { banner("Le dialogue est terminé : touchez « Voir mon bilan ».", "info"); return; }
  }
  Mic.tap({
    mode: "answer",
    onInterim: function(t){ $("live").textContent = "🎤 « " + t + " »"; },
    onResult: function(alts){ $("live").textContent = ""; submitAnswer(alts); },
    onEmpty: function(){ $("live").textContent = ""; banner(MSG.empty, "info"); },
    onError: function(k){ $("live").textContent = ""; banner(MSG[k] || MSG.generic, "warn"); }
  });
}

/* ---------- end screen ---------- */
function summary(){
  const ids = Object.keys(run.rec).sort(function(a, b){ return run.rec[a].idx - run.rec[b].idx; });
  let pts = 0; ids.forEach(function(id){ pts += run.rec[id].best.score; });
  const max = ids.length * 3;
  return { ids: ids, pts: pts, max: max, pct: max ? Math.round(pts / max * 100) : 0 };
}
function reportText(){
  const s = summary();
  const lines = ["Bilan — " + L.title + " (" + LV + ")", "Élève : " + store.names[student], "Score : " + s.pct + " % (" + s.pts + "/" + s.max + ")", ""];
  s.ids.forEach(function(id, n){
    const rec = run.rec[id], b = rec.best;
    lines.push("Tour " + (n + 1) + " — " + rec.r.bot);
    lines.push("  Élève : " + b.text + "  [" + b.score + "/3]");
    lines.push("  Modèle : " + rec.r.model);
    b.missing.forEach(function(q){ lines.push("  - Missing: " + q.label); });
    b.mistakes.forEach(function(m){ lines.push("  - " + m.tip); });
  });
  return lines.join("\n");
}
function showEnd(){
  if (!run) return;
  Mic.cancel(); stopBot(); clearTimeout(run.nextTimer);
  const s = summary();
  if (!run.saved) {
    run.saved = true;
    const st = store.stats[student];
    st.attempts = (st.attempts || 0) + 1; st.last = s.pct; st.best = Math.max(st.best == null ? 0 : st.best, s.pct);
    saveStore();
  }
  $("end-who").textContent = store.names[student];
  $("end-pct").textContent = s.pct + " %";
  $("end-pts").textContent = s.pts + " / " + s.max + " points";
  $("end-msg").textContent = s.pct >= 90 ? "Excellent ! 🎉" : s.pct >= 70 ? "Très bien ! 👏" : s.pct >= 50 ? "Bien, continuez ! 💪" : "Courage, essayez encore ! 🌱";
  const corr = $("end-corr"); corr.textContent = "";
  let any = false;
  s.ids.forEach(function(id, n){
    const rec = run.rec[id], b = rec.best;
    if (!b.missing.length && !b.mistakes.length) return;
    any = true;
    const box = el("div", "turn");
    box.appendChild(el("div", null, "Tour " + (n + 1) + " — " + rec.r.bot));
    const ul = el("ul", "corr");
    b.missing.forEach(function(q){ ul.appendChild(el("li", null, "Missing: " + q.label + (q.eg ? " — e.g. « " + q.eg + " »" : ""))); });
    b.mistakes.forEach(function(m){ ul.appendChild(el("li", null, m.tip)); });
    box.appendChild(ul); corr.appendChild(box);
  });
  if (!any) corr.appendChild(el("div", "card", "Aucune correction : bravo ! 🎉"));
  const tn = $("end-turns"); tn.textContent = "";
  s.ids.forEach(function(id, n){
    const rec = run.rec[id], b = rec.best;
    const box = el("div", "turn");
    const q = el("div"); q.appendChild(el("span", "s s" + b.score, b.score + "/3")); q.appendChild(el("b", null, "Tour " + (n + 1) + " — ")); q.appendChild(document.createTextNode(rec.r.bot));
    box.appendChild(q);
    box.appendChild(el("div", null, "Vous avez dit : « " + b.text + " »"));
    const m = el("div"); m.appendChild(document.createTextNode("Réponse modèle : " + rec.r.model + " "));
    const p = el("button", "mini", "🔊"); p.type = "button"; p.setAttribute("aria-label", "Écouter la réponse modèle");
    p.onclick = function(){ Mic.cancel(); speak(rec.r.model); };
    m.appendChild(p); box.appendChild(m); tn.appendChild(box);
  });
  show("end");
}

/* ---------- teacher space ---------- */
let resetArmed = false;
function renderProf(){
  const tb = $("prof-body"); tb.textContent = "";
  for (let i = 0; i < N; i++) {
    const st = store.stats[i], tr = document.createElement("tr");
    tr.appendChild(el("td", null, String(i + 1)));
    const td = document.createElement("td"), inp = document.createElement("input");
    inp.type = "text"; inp.value = store.names[i]; inp.setAttribute("aria-label", "Nom de l'élève " + (i + 1));
    inp.oninput = (function(idx, input){ return function(){ store.names[idx] = input.value || ("Élève " + (idx + 1)); saveStore(); fillSelect(); }; })(i, inp);
    td.appendChild(inp); tr.appendChild(td);
    tr.appendChild(el("td", null, String(st.attempts || 0)));
    tr.appendChild(el("td", null, st.last == null ? "–" : st.last + " %"));
    tr.appendChild(el("td", null, st.best == null ? "–" : st.best + " %"));
    tb.appendChild(tr);
  }
}
function allResultsText(){
  const rows = ["Élève\tEssais\tDernier score (%)\tMeilleur score (%)"];
  for (let i = 0; i < N; i++) { const st = store.stats[i]; rows.push([store.names[i], st.attempts || 0, st.last == null ? "" : st.last, st.best == null ? "" : st.best].join("\t")); }
  return rows.join("\n");
}

/* ---------- wiring ---------- */
$("title").textContent = L.title || "Parlons français";
$("levelbadge").textContent = LV;
$("scene").textContent = L.scene_en || "";
loadStore(); fillSelect();
$("student").onchange = function(){ student = $("student").selectedIndex; };
$("btn-start").onclick = function(){ student = $("student").selectedIndex; Mic.cancel(); $("testout").textContent = ""; startRun(); };
$("btn-test").onclick = function(){
  Mic.tap({
    mode: "test",
    onInterim: function(t){ $("testout").textContent = "🎤 « " + t + " »"; },
    onResult: function(alts){ $("testout").textContent = "✅ J'ai entendu : « " + alts[0] + " ». Le micro fonctionne !"; },
    onEmpty: function(){ $("testout").textContent = "❌ " + MSG.empty; },
    onError: function(k){ $("testout").textContent = ""; banner(MSG[k] || MSG.generic, "warn"); }
  });
};
$("btn-prof").onclick = function(){ Mic.cancel(); renderProf(); show("prof"); };
$("prof-back").onclick = function(){ fillSelect(); show("start"); };
$("prof-copy").onclick = function(){ copyText(allResultsText()).then(function(ok){ flash($("prof-copy"), ok); }); };
$("prof-reset").onclick = function(){
  const b = $("prof-reset");
  if (!resetArmed) { resetArmed = true; b.textContent = "Tap again to confirm"; setTimeout(function(){ resetArmed = false; b.textContent = "Reset"; }, 3500); return; }
  resetArmed = false; b.textContent = "Reset";
  for (let i = 0; i < N; i++) store.stats[i] = { attempts: 0, last: null, best: null };
  saveStore(); renderProf();
};
$("mic").onclick = micTap;
$("btn-hint").onclick = function(){
  if (!cur) return;
  const r = cur.r;
  const h = r.hint || ("Try to include: " + (r.required || []).map(function(q){ return q.label; }).join(" · "));
  const row = el("div", "msg hint"); row.appendChild(el("div", "bubble", "💡 " + h));
  $("log").appendChild(row); scrollLog();
};
$("btn-repeat").onclick = function(){ if (!cur) return; Mic.cancel(); speak(cur.r.bot); };
$("typeform").onsubmit = function(e){
  e.preventDefault();
  const v = $("typed").value.trim();
  if (!v || !run) return;
  Mic.cancel(); stopBot();
  if (!cur && run.nextTimer) { clearTimeout(run.nextTimer); run.nextTimer = null; presentTurn({ speak: false }); }
  if (!cur) return;
  $("typed").value = "";
  submitAnswer([v]);
};
$("btn-quit").onclick = function(){ Mic.cancel(); stopBot(); if (run) clearTimeout(run.nextTimer); run = null; cur = null; show("start"); };
$("btn-again").onclick = function(){ startRun(); };
$("btn-copy").onclick = function(){ copyText(reportText()).then(function(ok){ flash($("btn-copy"), ok); }); };
$("btn-other").onclick = function(){
  Mic.cancel(); stopBot();
  student = (student + 1) % N; fillSelect(); run = null; cur = null; show("start");
};
document.addEventListener("visibilitychange", function(){ if (document.hidden) { Mic.cancel(); stopBot(); } });

/* first look: warn early about problems that will stop the microphone */
(function(){
  const h = location.hostname;
  const secure = location.protocol === "https:" || h === "localhost" || h === "127.0.0.1";
  if (!SR) banner(MSG.unsupported, "info");
  else if (!secure) banner(MSG.https, "warn");
  else {
    setTimeout(function(){
      loadVoices();
      if (!("speechSynthesis" in window) || (voices.length && !voices.some(function(v){ return /^fr/i.test(v.lang); }))) banner(MSG.novoice, "info");
    }, 800);
  }
})();
})();
